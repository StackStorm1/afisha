name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Линтер backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      # Полная версия, а не плавающий мажор: setup-uv не поддерживает тег v10,
      # его подвижные мажорные теги обрываются на v7.
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.9.16"

      - run: uv sync --locked

      - run: uv run ruff check .
