openapi: 3.1.0

info:
  title: Afisha API
  version: 1.0.0
  description: |
    REST API для сервиса Афиша — каталог событий и бронирование билетов.

    ## Аутентификация
    Защищённые endpoints требуют заголовок `Authorization: Bearer <token>`.
    Токен выдаётся при регистрации или входе.

    ## Роли
    | Роль | Описание |
    | `visitor` | Авторизованный посетитель — покупка билетов, личный кабинет |
    | `admin` | Администратор — управление событиями, сеансами, площадками |

    Гость (неавторизованный) может читать каталог без токена.
    Endpoints под `/admin/` требуют роль `admin`.

    ## Формат ошибки
    Все ошибки возвращают единый объект:
    ```json
    {
      "code":    "VALIDATION_ERROR",
      "message": "Текст ошибки",
      "details": [
        { "field": "email", "message": "Некорректный формат" }
      ]
    }
    ```
    `details` присутствует только при ошибках валидации (422).

    ## Коды ошибок
    | code | HTTP | Описание |
    |---|---|---|
    | `VALIDATION_ERROR` | 422 | Нарушены правила валидации полей |
    | `UNAUTHORIZED` | 401 | Токен отсутствует или недействителен |
    | `FORBIDDEN` | 403 | Нет прав на ресурс (недостаточная роль) |
    | `NOT_FOUND` | 404 | Ресурс не найден |
    | `EMAIL_ALREADY_TAKEN` | 409 | Email уже зарегистрирован |
    | `INVALID_CREDENTIALS` | 401 | Неверный email или пароль |
    | `SESSION_NOT_ACTIVE` | 409 | Сеанс отменён или завершён — нельзя купить (BR-04) |
    | `SESSION_IN_PAST` | 422 | Нельзя создать сеанс с датой в прошлом (BR-03) |
    | `SESSION_ALREADY_CANCELLED` | 409 | Сеанс уже отменён |
    | `SEAT_ALREADY_TAKEN` | 409 | Одно или несколько мест уже заняты (BR-01) |
    | `ORDER_NOT_CANCELLABLE` | 409 | Бронь уже отменена или завершена |
    | `ORDER_ALREADY_PAID` | 409 | Бронь уже оплачена |
    | `PAYMENT_FAILED` | 402 | Платёж отклонён шлюзом — можно повторить |

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: auth
    description: Регистрация, вход, профиль
  - name: categories
    description: Категории событий
  - name: events
    description: Каталог событий
  - name: sessions
    description: Сеансы и схема зала
  - name: orders
    description: Брони и оплата
  - name: admin
    description: Управление контентом (роль admin)

paths:

  # ─────────────────────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────────────────────

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Регистрация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: user@example.com
              password: s3cr3tPass
      responses:
        '201':
          description: Пользователь создан, токен выдан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                data:
                  token: eyJhbGciOiJIUzI1NiJ9...
                  user:
                    id: a1b2c3d4-0000-0000-0000-000000000001
                    email: user@example.com
                    role: visitor
                    created_at: '2026-09-11T10:00:00Z'
        '409':
          description: Email уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: EMAIL_ALREADY_TAKEN
                message: Пользователь с таким email уже существует
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Вход пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: s3cr3tPass
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                data:
                  token: eyJhbGciOiJIUzI1NiJ9...
                  user:
                    id: a1b2c3d4-0000-0000-0000-000000000001
                    email: user@example.com
                    role: visitor
                    created_at: '2026-09-11T10:00:00Z'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: Неверный email или пароль
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Профиль текущего пользователя
      description: |
        Используется для восстановления сессии после перезагрузки страницы.
        Фронт вызывает при старте приложения, если в localStorage есть токен (US-09).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/UserProfile'
              example:
                data:
                  id: a1b2c3d4-0000-0000-0000-000000000001
                  email: user@example.com
                  role: visitor
                  created_at: '2026-09-11T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ─────────────────────────────────────────────────────────────
  # CATEGORIES
  # ─────────────────────────────────────────────────────────────

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: Список категорий
      description: Используется для рендера фильтров в каталоге.
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
              example:
                data:
                  - id: 1
                    code: THEATRE
                    name: Театр
                    slug: theatre
                  - id: 2
                    code: CONCERT
                    name: Концерт
                    slug: concert

  # ─────────────────────────────────────────────────────────────
  # EVENTS
  # ─────────────────────────────────────────────────────────────

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Каталог событий с фильтрами
      description: |
        Возвращает события, у которых есть хотя бы один активный сеанс,
        удовлетворяющий переданным фильтрам.
        Доступен гостям без токена.
      parameters:
        - name: category
          in: query
          description: Slug категории
          schema:
            type: string
            example: theatre
        - name: date_from
          in: query
          description: Нижняя граница даты начала сеанса (ISO 8601 date)
          schema:
            type: string
            format: date
            example: '2026-10-01'
        - name: date_to
          in: query
          description: Верхняя граница даты начала сеанса (ISO 8601 date, включительно до конца дня)
          schema:
            type: string
            format: date
            example: '2026-10-31'
        - name: q
          in: query
          description: Полнотекстовый поиск по названию и описанию (US-02)
          schema:
            type: string
            example: Гамлет
        - name: sort
          in: query
          description: Сортировка результатов (US-06)
          schema:
            type: string
            enum: [date_asc, date_desc, price_asc, price_desc]
            default: date_asc
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Постранично список событий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListResponse'
              example:
                data:
                  - id: b1c2d3e4-0000-0000-0000-000000000001
                    title: Гамлет
                    category:
                      id: 1
                      code: THEATRE
                      name: Театр
                      slug: theatre
                    age_rating: 16+
                    poster_url: https://cdn.example.com/hamlet.jpg
                    nearest_session_at: '2026-10-15T19:00:00Z'
                    min_price: '2000.00'
                    sessions_count: 5
                pagination:
                  page: 1
                  per_page: 20
                  total: 1
                  total_pages: 1

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: Карточка события
      description: Доступна гостям без токена (US-04).
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
      responses:
        '200':
          description: Детали события
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EventDetail'
              example:
                data:
                  id: b1c2d3e4-0000-0000-0000-000000000001
                  title: Гамлет
                  description: Трагедия Шекспира в постановке Товстоногова.
                  category:
                    id: 1
                    code: THEATRE
                    name: Театр
                    slug: theatre
                  age_rating: 16+
                  poster_url: https://cdn.example.com/hamlet.jpg
                  nearest_session_at: '2026-10-15T19:00:00Z'
                  min_price: '2000.00'
                  sessions_count: 5
                  created_at: '2026-09-01T00:00:00Z'
                  updated_at: '2026-09-10T12:00:00Z'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{id}/sessions:
    get:
      operationId: listEventSessions
      tags: [sessions]
      summary: Список сеансов события
      description: |
        Возвращает сеансы события. По умолчанию только активные.
        Доступен гостям без токена (US-05).
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          description: Статус сеанса (по умолчанию active)
          schema:
            type: string
            enum: [active, cancelled, completed]
            default: active
      responses:
        '200':
          description: Список сеансов события
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
              example:
                data:
                  - id: c1d2e3f4-0000-0000-0000-000000000001
                    event_id: b1c2d3e4-0000-0000-0000-000000000001
                    venue:
                      id: d1e2f3a4-0000-0000-0000-000000000001
                      name: Большой театр
                      address: Театральная пл., 1
                      city:
                        id: 1
                        name: Москва
                        slug: moskva
                      rows_count: 20
                      seats_per_row: 30
                    city:
                      id: 1
                      name: Москва
                      slug: moskva
                    starts_at: '2026-10-15T19:00:00Z'
                    price: '2000.00'
                    total_seats: 300
                    seats_left: 142
                    status: active
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────────────────────────
  # SESSIONS
  # ─────────────────────────────────────────────────────────────

  /sessions/{id}:
    get:
      operationId: getSession
      tags: [sessions]
      summary: Детали сеанса
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
      responses:
        '200':
          description: Детали сеанса
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'

  /sessions/{id}/seats:
    get:
      operationId: getSessionSeats
      tags: [sessions]
      summary: Схема зала сеанса (US-10)
      description: |
        Возвращает схему зала с актуальным статусом каждого места: свободно, занято, выбрано.
        Вызывается при открытии экрана выбора мест.
        Места принадлежат площадке; занятость определяется активными бронями на данный сеанс.
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
      responses:
        '200':
          description: Схема зала с местами
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SeatMap'
              example:
                data:
                  session_id: c1d2e3f4-0000-0000-0000-000000000001
                  status: active
                  base_price: '2000.00'
                  rows:
                    - row_no: 1
                      seats:
                        - id: a1b2c3d4-0001-0000-0000-000000000001
                          seat_no: 1
                          price_category: STALLS
                          price: '2000.00'
                          status: free
                        - id: a1b2c3d4-0001-0000-0000-000000000002
                          seat_no: 2
                          price_category: STALLS
                          price: '2000.00'
                          status: held
                    - row_no: 2
                      seats:
                        - id: a1b2c3d4-0002-0000-0000-000000000001
                          seat_no: 1
                          price_category: BALCONY
                          price: '1600.00'
                          status: free
        '404':
          $ref: '#/components/responses/NotFound'

  # ─────────────────────────────────────────────────────────────
  # ORDERS
  # ─────────────────────────────────────────────────────────────

  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Создание брони — выбор мест (US-11)
      description: |
        Удерживает выбранные места на BR-02 минут (15 мин) — создаёт записи в `bookings`
        со статусом HELD и заполненным `expires_at` (BR-02).
        Атомарный INSERT с проверкой `uq_bookings_active_seat` гарантирует,
        что одно место не займут дважды (BR-01).
        Созданный заказ имеет статус `pending` — места удерживаются, оплата ещё не прошла.
        Для оплаты вызвать `POST /orders/{id}/pay`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              session_id: c1d2e3f4-0000-0000-0000-000000000001
              seat_ids:
                - a1b2c3d4-0001-0000-0000-000000000001
                - a1b2c3d4-0001-0000-0000-000000000003
      responses:
        '201':
          description: Бронь создана, статус pending, места удерживаются
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OrderDetail'
              example:
                data:
                  id: e1f2a3b4-0000-0000-0000-000000000001
                  session:
                    id: c1d2e3f4-0000-0000-0000-000000000001
                    event:
                      id: b1c2d3e4-0000-0000-0000-000000000001
                      title: Гамлет
                      poster_url: https://cdn.example.com/hamlet.jpg
                    venue:
                      name: Большой театр
                      address: Театральная пл., 1
                      city:
                        id: 1
                        name: Москва
                        slug: moskva
                    starts_at: '2026-10-15T19:00:00Z'
                    price: '2000.00'
                  seats:
                    - id: a1b2c3d4-0001-0000-0000-000000000001
                      row_no: 1
                      seat_no: 1
                      price_category: STALLS
                      price: '2000.00'
                    - id: a1b2c3d4-0001-0000-0000-000000000003
                      row_no: 1
                      seat_no: 3
                      price_category: STALLS
                      price: '2000.00'
                  total_price: '4000.00'
                  status: pending
                  expires_at: '2026-10-01T10:15:00Z'
                  created_at: '2026-10-01T10:00:00Z'
                  updated_at: '2026-10-01T10:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Сеанс неактивен или место уже занято
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                seatTaken:
                  summary: Место уже занято (BR-01, US-13)
                  value:
                    code: SEAT_ALREADY_TAKEN
                    message: Одно или несколько выбранных мест уже заняты
                sessionNotActive:
                  summary: Сеанс не активен (BR-04)
                  value:
                    code: SESSION_NOT_ACTIVE
                    message: Сеанс отменён или уже завершён
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      operationId: listMyOrders
      tags: [orders]
      summary: Мои брони (US-15)
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу брони
          schema:
            type: string
            enum: [pending, paid, cancelled, failed]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Брони текущего пользователя (сортировка по created_at desc)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Детали брони
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
      responses:
        '200':
          description: Детали брони
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: cancelOrder
      tags: [orders]
      summary: Отмена брони (US-17)
      description: |
        Переводит заказ в статус `cancelled` и освобождает места (брони → CANCELLED).
        Отменить можно только собственную бронь (BR-07).
        Оплаченную бронь отменить нельзя через API (только через отмену сеанса — BR-06).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
      responses:
        '200':
          description: Бронь отменена
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Бронь нельзя отменить
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ORDER_NOT_CANCELLABLE
                message: Оплаченную бронь можно отменить только через поддержку

  /orders/{id}/pay:
    post:
      operationId: payOrder
      tags: [orders]
      summary: Оплата брони (US-14, US-16)
      description: |
        Инициирует оплату через платёжный шлюз (заглушка в MVP).
        При успехе статус заказа становится `paid`, брони переходят в PAID (BR-05).
        При отказе шлюза — `failed`, возвращается 402; пользователь может повторить вызов (US-16).
        Места остаются удержанными до истечения `expires_at` или явной отмены (BR-02).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
      responses:
        '200':
          description: Оплата прошла успешно, статус заказа — paid
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/OrderDetail'
              example:
                data:
                  id: e1f2a3b4-0000-0000-0000-000000000001
                  session:
                    id: c1d2e3f4-0000-0000-0000-000000000001
                    event:
                      id: b1c2d3e4-0000-0000-0000-000000000001
                      title: Гамлет
                      poster_url: https://cdn.example.com/hamlet.jpg
                    venue:
                      name: Большой театр
                      address: Театральная пл., 1
                      city:
                        id: 1
                        name: Москва
                        slug: moskva
                    starts_at: '2026-10-15T19:00:00Z'
                    price: '2000.00'
                  seats:
                    - id: a1b2c3d4-0001-0000-0000-000000000001
                      row_no: 1
                      seat_no: 1
                      price_category: STALLS
                      price: '2000.00'
                    - id: a1b2c3d4-0001-0000-0000-000000000003
                      row_no: 1
                      seat_no: 3
                      price_category: STALLS
                      price: '2000.00'
                  total_price: '4000.00'
                  status: paid
                  expires_at: null
                  created_at: '2026-10-01T10:00:00Z'
                  updated_at: '2026-10-01T10:05:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Платёж отклонён шлюзом — можно повторить (US-16)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PAYMENT_FAILED
                message: Платёж отклонён. Проверьте данные карты и попробуйте снова
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Заказ уже оплачен или отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyPaid:
                  value:
                    code: ORDER_ALREADY_PAID
                    message: Заказ уже оплачен
                cancelled:
                  value:
                    code: ORDER_NOT_CANCELLABLE
                    message: Нельзя оплатить отменённый заказ

  # ─────────────────────────────────────────────────────────────
  # ADMIN — VENUES
  # ─────────────────────────────────────────────────────────────

  /admin/venues:
    get:
      operationId: adminListVenues
      tags: [admin]
      summary: Список площадок
      description: Используется в форме создания сеанса для выбора площадки.
      security:
        - bearerAuth: []
      parameters:
        - name: city_slug
          in: query
          description: Фильтр по slug города
          schema:
            type: string
            example: moskva
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Список площадок
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Venue'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      operationId: adminCreateVenue
      tags: [admin]
      summary: Создание площадки и схемы зала (US-19)
      description: |
        Создаёт площадку с прямоугольной сеткой мест.
        После создания сервер генерирует `rows_count × seats_per_row` записей в `seats`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVenueRequest'
            example:
              name: Большой театр
              address: Театральная пл., 1
              city_id: 1
              rows_count: 20
              seats_per_row: 30
      responses:
        '201':
          description: Площадка создана
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Venue'
              example:
                data:
                  id: d1e2f3a4-0000-0000-0000-000000000001
                  name: Большой театр
                  address: Театральная пл., 1
                  city:
                    id: 1
                    name: Москва
                    slug: moskva
                  rows_count: 20
                  seats_per_row: 30
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/venues/{id}:
    patch:
      operationId: adminUpdateVenue
      tags: [admin]
      summary: Редактирование площадки (US-22)
      description: |
        Нельзя изменить `rows_count` или `seats_per_row`, если есть активные брони (BR-08).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVenueRequest'
      responses:
        '200':
          description: Площадка обновлена
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Venue'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ─────────────────────────────────────────────────────────────
  # ADMIN — EVENTS
  # ─────────────────────────────────────────────────────────────

  /admin/events:
    post:
      operationId: adminCreateEvent
      tags: [admin]
      summary: Создание события (US-20)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              title: Гамлет
              description: Трагедия Шекспира в постановке Товстоногова.
              category_id: 1
              age_rating: 16+
              poster_url: https://cdn.example.com/hamlet.jpg
      responses:
        '201':
          description: Событие создано
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EventBase'
              example:
                data:
                  id: b1c2d3e4-0000-0000-0000-000000000001
                  title: Гамлет
                  description: Трагедия Шекспира в постановке Товстоногова.
                  category:
                    id: 1
                    code: THEATRE
                    name: Театр
                    slug: theatre
                  age_rating: 16+
                  poster_url: https://cdn.example.com/hamlet.jpg
                  created_at: '2026-09-01T00:00:00Z'
                  updated_at: '2026-09-01T00:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/events/{id}:
    patch:
      operationId: adminUpdateEvent
      tags: [admin]
      summary: Редактирование события (US-22)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Событие обновлено
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/EventBase'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/events/{id}/sessions:
    post:
      operationId: adminCreateSession
      tags: [admin]
      summary: Добавление сеанса к событию (US-21)
      description: |
        Нельзя создать сеанс с `starts_at` в прошлом (BR-03).
        `total_seats` не может превышать `rows_count × seats_per_row` площадки.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
            example:
              venue_id: d1e2f3a4-0000-0000-0000-000000000001
              starts_at: '2026-10-15T19:00:00Z'
              price: '2000.00'
              total_seats: 300
      responses:
        '201':
          description: Сеанс создан
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Событие или площадка не найдены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Ошибка валидации или дата в прошлом (BR-03)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  value:
                    code: VALIDATION_ERROR
                    message: Ошибка валидации
                    details:
                      - field: price
                        message: Должна быть неотрицательной
                pastDate:
                  summary: Дата в прошлом (BR-03)
                  value:
                    code: SESSION_IN_PAST
                    message: Нельзя создать сеанс с датой в прошлом

  # ─────────────────────────────────────────────────────────────
  # ADMIN — SESSIONS
  # ─────────────────────────────────────────────────────────────

  /admin/sessions/{id}:
    patch:
      operationId: adminUpdateSession
      tags: [admin]
      summary: Редактирование сеанса (US-22)
      description: |
        Нельзя изменить `starts_at` на дату в прошлом (BR-03).
        Нельзя уменьшить `total_seats` ниже числа уже купленных билетов.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionRequest'
      responses:
        '200':
          description: Сеанс обновлён
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /admin/sessions/{id}/cancel:
    post:
      operationId: adminCancelSession
      tags: [admin]
      summary: Отмена сеанса (US-23)
      description: |
        Переводит сеанс в статус `cancelled`.
        Все заказы на этот сеанс переходят в `cancelled`, брони освобождаются (BR-06).
        Покупатели увидят статус в личном кабинете.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UUIDPath'
      responses:
        '200':
          description: Сеанс отменён
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
              example:
                data:
                  id: c1d2e3f4-0000-0000-0000-000000000001
                  event_id: b1c2d3e4-0000-0000-0000-000000000001
                  venue:
                    id: d1e2f3a4-0000-0000-0000-000000000001
                    name: Большой театр
                    address: Театральная пл., 1
                    city:
                      id: 1
                      name: Москва
                      slug: moskva
                    rows_count: 20
                    seats_per_row: 30
                  city:
                    id: 1
                    name: Москва
                    slug: moskva
                  starts_at: '2026-10-15T19:00:00Z'
                  price: '2000.00'
                  total_seats: 300
                  seats_left: 0
                  status: cancelled
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Сеанс уже отменён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: SESSION_ALREADY_CANCELLED
                message: Сеанс уже отменён

# ─────────────────────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────────────────────

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UUIDPath:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      example: a1b2c3d4-0000-0000-0000-000000000001

  responses:
    Unauthorized:
      description: Токен отсутствует или недействителен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: Требуется авторизация

    Forbidden:
      description: Нет прав на ресурс
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: Недостаточно прав

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: Ресурс не найден

    ValidationError:
      description: Ошибка валидации полей запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: Ошибка валидации
            details:
              - field: email
                message: Некорректный формат email
              - field: password
                message: Минимум 8 символов

  schemas:

    # ── Primitives ──────────────────────────────────────────────

    UUID:
      type: string
      format: uuid
      example: a1b2c3d4-0000-0000-0000-000000000001

    Timestamp:
      type: string
      format: date-time
      example: '2026-09-11T10:00:00Z'

    Money:
      type: string
      pattern: '^[0-9]+\.[0-9]{2}$'
      description: Денежная сумма в виде строки с двумя знаками после точки
      example: '2000.00'

    Pagination:
      type: object
      required: [page, per_page, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: Ресурс не найден
        details:
          type: array
          description: Присутствует только при VALIDATION_ERROR
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: Некорректный формат email

    # ── Auth ────────────────────────────────────────────────────

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: user@example.com
        password:
          type: string
          minLength: 8
          maxLength: 255
          example: s3cr3tPass

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          example: s3cr3tPass

    UserProfile:
      type: object
      required: [id, email, role, created_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        email:
          type: string
          format: email
          example: user@example.com
        role:
          type: string
          enum: [visitor, admin]
          example: visitor
        created_at:
          $ref: '#/components/schemas/Timestamp'

    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, user]
          properties:
            token:
              type: string
              description: JWT Bearer-токен
              example: eyJhbGciOiJIUzI1NiJ9...
            user:
              $ref: '#/components/schemas/UserProfile'

    # ── City ────────────────────────────────────────────────────

    City:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          maxLength: 100
          example: Москва
        slug:
          type: string
          maxLength: 100
          example: moskva

    # ── Category ────────────────────────────────────────────────

    Category:
      type: object
      required: [id, code, name, slug]
      properties:
        id:
          type: integer
          example: 1
        code:
          type: string
          enum: [CONCERT, THEATRE, STANDUP, FESTIVAL]
          example: THEATRE
        name:
          type: string
          maxLength: 100
          example: Театр
        slug:
          type: string
          maxLength: 100
          example: theatre

    # ── Venue ───────────────────────────────────────────────────

    Venue:
      type: object
      required: [id, name, address, city, rows_count, seats_per_row]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        name:
          type: string
          maxLength: 255
          example: Большой театр
        address:
          type: string
          maxLength: 500
          example: Театральная пл., 1
        city:
          $ref: '#/components/schemas/City'
        rows_count:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        seats_per_row:
          type: integer
          minimum: 1
          maximum: 100
          example: 30

    CreateVenueRequest:
      type: object
      required: [name, address, city_id, rows_count, seats_per_row]
      properties:
        name:
          type: string
          maxLength: 255
          example: Большой театр
        address:
          type: string
          maxLength: 500
          example: Театральная пл., 1
        city_id:
          type: integer
          description: ID города. В MVP единственный город — Москва (id=1).
          example: 1
        rows_count:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        seats_per_row:
          type: integer
          minimum: 1
          maximum: 100
          example: 30

    UpdateVenueRequest:
      type: object
      description: Все поля опциональны — передавать только изменяемые
      properties:
        name:
          type: string
          maxLength: 255
        address:
          type: string
          maxLength: 500
        rows_count:
          type: integer
          minimum: 1
          maximum: 100
        seats_per_row:
          type: integer
          minimum: 1
          maximum: 100

    # ── Event ───────────────────────────────────────────────────

    EventBase:
      type: object
      description: Базовое представление события (без вычисляемых полей по сеансам)
      required: [id, title, category, age_rating, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        title:
          type: string
          maxLength: 255
          example: Гамлет
        description:
          type: ['string', 'null']
          example: Трагедия Шекспира в постановке Товстоногова.
        category:
          $ref: '#/components/schemas/Category'
        age_rating:
          type: string
          enum: ['0+', '6+', '12+', '16+', '18+']
          example: 16+
        poster_url:
          type: ['string', 'null']
          maxLength: 500
          example: https://cdn.example.com/hamlet.jpg
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    EventSummary:
      type: object
      description: Краткое представление события для каталога
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          properties:
            nearest_session_at:
              $ref: '#/components/schemas/Timestamp'
            min_price:
              $ref: '#/components/schemas/Money'
            sessions_count:
              type: integer
              minimum: 0
              example: 5

    EventDetail:
      type: object
      description: Полное представление события для карточки (включает вычисляемые поля если есть сеансы)
      allOf:
        - $ref: '#/components/schemas/EventSummary'

    EventListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    CreateEventRequest:
      type: object
      required: [title, category_id, age_rating]
      properties:
        title:
          type: string
          maxLength: 255
          example: Гамлет
        description:
          type: ['string', 'null']
          example: Трагедия Шекспира в постановке Товстоногова.
        category_id:
          type: integer
          example: 1
        age_rating:
          type: string
          enum: ['0+', '6+', '12+', '16+', '18+']
          example: 16+
        poster_url:
          type: ['string', 'null']
          maxLength: 500
          example: https://cdn.example.com/hamlet.jpg

    UpdateEventRequest:
      type: object
      description: Все поля опциональны — передавать только изменяемые
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: ['string', 'null']
        category_id:
          type: integer
        age_rating:
          type: string
          enum: ['0+', '6+', '12+', '16+', '18+']
        poster_url:
          type: ['string', 'null']
          maxLength: 500

    # ── Session ─────────────────────────────────────────────────

    Session:
      type: object
      required: [id, event_id, venue, city, starts_at, price, total_seats, seats_left, status]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        event_id:
          $ref: '#/components/schemas/UUID'
        venue:
          $ref: '#/components/schemas/Venue'
        city:
          $ref: '#/components/schemas/City'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        price:
          $ref: '#/components/schemas/Money'
        total_seats:
          type: integer
          minimum: 1
          example: 300
        seats_left:
          type: integer
          minimum: 0
          example: 142
        status:
          type: string
          enum: [active, cancelled, completed]
          example: active

    # ── Seat map ─────────────────────────────────────────────────

    SeatInfo:
      type: object
      required: [id, seat_no, price_category, price, status]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        seat_no:
          type: integer
          minimum: 1
          example: 12
        price_category:
          type: string
          enum: [STALLS, BALCONY]
          example: STALLS
        price:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum: [free, held, paid]
          example: free

    SeatRow:
      type: object
      required: [row_no, seats]
      properties:
        row_no:
          type: integer
          minimum: 1
          example: 5
        seats:
          type: array
          items:
            $ref: '#/components/schemas/SeatInfo'

    SeatMap:
      type: object
      description: Схема зала с актуальным статусом каждого места
      required: [session_id, status, price, rows]
      properties:
        session_id:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          enum: [active, cancelled, completed]
          example: active
        price:
          $ref: '#/components/schemas/Money'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/SeatRow'

    CreateSessionRequest:
      type: object
      required: [venue_id, starts_at, price, total_seats]
      properties:
        venue_id:
          $ref: '#/components/schemas/UUID'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        price:
          $ref: '#/components/schemas/Money'
        total_seats:
          type: integer
          minimum: 1
          example: 300

    UpdateSessionRequest:
      type: object
      description: Все поля опциональны — передавать только изменяемые
      properties:
        venue_id:
          $ref: '#/components/schemas/UUID'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        price:
          $ref: '#/components/schemas/Money'
        total_seats:
          type: integer
          minimum: 1

    # ── Order ───────────────────────────────────────────────────

    CreateOrderRequest:
      type: object
      required: [session_id, seat_ids]
      properties:
        session_id:
          $ref: '#/components/schemas/UUID'
        seat_ids:
          type: array
          description: UUID мест, выбранных на схеме зала
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/UUID'

    BookedSeat:
      type: object
      description: Место в составе заказа
      required: [id, row_no, seat_no, price_category, price]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        row_no:
          type: integer
          minimum: 1
          example: 5
        seat_no:
          type: integer
          minimum: 1
          example: 12
        price_category:
          type: string
          enum: [STALLS, BALCONY]
          example: STALLS
        price:
          $ref: '#/components/schemas/Money'

    OrderSessionRef:
      type: object
      description: Краткая информация о сеансе внутри брони
      required: [id, event, venue, starts_at, price]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        event:
          type: object
          required: [id, title]
          properties:
            id:
              $ref: '#/components/schemas/UUID'
            title:
              type: string
              example: Гамлет
            poster_url:
              type: ['string', 'null']
              example: https://cdn.example.com/hamlet.jpg
        venue:
          type: object
          required: [name, address, city]
          properties:
            name:
              type: string
              example: Большой театр
            address:
              type: string
              example: Театральная пл., 1
            city:
              $ref: '#/components/schemas/City'
        starts_at:
          $ref: '#/components/schemas/Timestamp'
        price:
          $ref: '#/components/schemas/Money'

    OrderDetail:
      type: object
      required: [id, session, seats, total_price, status, expires_at, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        session:
          $ref: '#/components/schemas/OrderSessionRef'
        seats:
          type: array
          description: Забронированные места
          items:
            $ref: '#/components/schemas/BookedSeat'
        total_price:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum: [pending, paid, cancelled, failed]
          example: pending
        expires_at:
          type: ['string', 'null']
          format: date-time
          description: Время истечения удержания мест. Заполнено только для статуса pending (BR-02).
          example: '2026-10-01T10:15:00Z'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        updated_at:
          $ref: '#/components/schemas/Timestamp'

    OrderListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderDetail'
        pagination:
          $ref: '#/components/schemas/Pagination'
