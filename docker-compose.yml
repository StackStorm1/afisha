services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Для Postgres <= 17 монтировать строго в /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    # Статика за nginx: в backend образ не ходит, браузер обращается к API
    # напрямую по адресу из VITE_API_BASE_URL. Поэтому depends_on не нужен.
    # Порт задан числом, как у backend, и намеренно не равен FRONTEND_PORT:
    # та переменная — порт dev-сервера Vite. Займи они один порт, обе привязки
    # прошли бы без ошибки, а отвечал бы dev-сервер (он слушает ::1).
    ports:
      - "8080:8080"

volumes:
  pgdata: