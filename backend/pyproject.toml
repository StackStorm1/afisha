[project]
name = "afisha-backend"
version = "0.1.0"
description = "Афиша — backend API (FastAPI)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "alembic==1.19.2",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt==2.13.0",
    "bcrypt==5.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "httpx==0.28.1",
    "ruff==0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
