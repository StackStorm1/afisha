# Заменяет conf.d/default.conf из базового образа.
server {
    # Базовый образ nginx-unprivileged работает от uid 101 и не может занять
    # порт ниже 1024, поэтому 8080, а не 80.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Бандл — 240 КБ, под gzip 78 КБ. Без сжатия разница уезжает в трафик
    # пользователя целиком.
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
    # По умолчанию nginx жмёт на уровне 1 — это 91 КБ вместо 78 КБ.
    gzip_comp_level 6;

    # Vite вшивает хеш содержимого в имя файла (index-vixZR8T8.js), поэтому
    # один и тот же URL никогда не меняет содержимое — кэшировать можно навсегда.
    # Одной директивой, а не expires + add_header: вместе они отдают два
    # заголовка Cache-Control сразу.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # У index.html хеша в имени нет, и именно он ссылается на assets. Если его
    # закэшировать, после деплоя браузер продолжит запрашивать старые файлы.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Маршрут /events/:eventId существует только в браузере — на диске такого
    # файла нет. Без подмены на index.html перезагрузка страницы события
    # вернула бы 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
